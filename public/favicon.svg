<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Base Icon Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#2e3545" stroke-width="3"/>
  <circle cx="50" cy="50" r="34" fill="url(#rocketGrad)" opacity="0.18" filter="url(#glow)"/>
  
  <!-- Rocket Graphic / Symbol -->
  <g transform="translate(50, 50) rotate(-45) translate(-50, -50)">
    <!-- Rocket Body -->
    <path d="M 50 18 C 38 32, 36 58, 36 68 L 64 68 C 64 58, 62 32, 50 18 Z" fill="url(#rocketGrad)"/>
    <!-- Rocket Window -->
    <circle cx="50" cy="42" r="6.5" fill="#0b0e14" stroke="#58a6ff" stroke-width="2"/>
    <!-- Left Wing -->
    <path d="M 36 54 L 22 68 L 36 68 Z" fill="#58a6ff"/>
    <!-- Right Wing -->
    <path d="M 64 54 L 78 68 L 64 68 Z" fill="#bc8cff"/>
    <!-- Flame Exhaust -->
    <path d="M 42 68 Q 50 86 50 86 Q 50 86 58 68 Z" fill="#f85149" filter="url(#glow)"/>
    <path d="M 46 68 Q 50 78 50 78 Q 50 78 54 68 Z" fill="#d29922"/>
  </g>
</svg>
